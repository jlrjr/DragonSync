[pytest]
# Pytest configuration for DragonSync refactored tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# addopts = --cov=refactor_project --cov-report=html --cov-report=term-missing

# Markers
markers =
    unit: Unit tests (isolated, fast)
    integration: Integration tests (multiple components)
    slow: Slow tests (may take >1 second)
    network: Tests requiring network access
    zmq: Tests requiring ZMQ
    mqtt: Tests requiring MQTT broker

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
