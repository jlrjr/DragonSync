[SETTINGS]
# ZMQ inputs
zmq_host = 127.0.0.1
zmq_port = 4224
zmq_status_port = 4225

# TAK Server (disabled in test)
tak_host = 
tak_port = 8089
tak_protocol = tcp
tak_tls_p12 = 
tak_tls_p12_pass = 
tak_tls_skip_verify = true

# Multicast (enabled for test)
enable_multicast = true
tak_multicast_addr = 239.2.3.1
tak_multicast_port = 6969
tak_multicast_interface = 0.0.0.0
multicast_ttl = 1

# Runtime
rate_limit = 1.0
max_drones = 10
inactivity_timeout = 30.0
enable_receive = false
log_level = DEBUG

# MQTT (disabled in test)
mqtt_enabled = false
mqtt_host = 127.0.0.1
mqtt_port = 1883
mqtt_topic = wardragon/drones
mqtt_username = 
mqtt_password = 
mqtt_tls = false
per_drone_enabled = true
per_drone_base = wardragon/drone
ha_enabled = true
ha_prefix = homeassistant
ha_device_base = wardragon_drone

# Lattice (disabled in test)
lattice_enabled = false
lattice_token = 
lattice_base_url = 
lattice_endpoint = 
lattice_source_name = DragonSync
lattice_drone_rate = 1.0
lattice_wd_rate = 0.2

# ADS-B (disabled in test)
adsb_enabled = false
adsb_json_url = http://127.0.0.1:8080/?all_with_pos
adsb_poll_interval = 1.0
adsb_min_alt = 0
adsb_max_alt = 0

[gps]
use_static_gps = true
static_lat = 42.3601
static_lon = -71.0589
static_alt = 10.0
